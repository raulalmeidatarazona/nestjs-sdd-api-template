version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7.0 does not ship the compiler API used by scripts/archcheck.mjs.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
